project:
  type: book
  output-dir: _book
  # the slide decks are a small sub-project; build them into _book/slides
  post-render: _scripts/build_slides.py

book:
  title: "omics-walkthru"
  subtitle: "A plain-language walk through sequencing data processing, from FASTQ to results"
  author: "JP Flores"
  date: today
  repo-url: https://github.com/jpflores-13/omics-walkthru
  repo-actions: [edit, issue]
  site-url: https://jpflores-13.github.io/omics-walkthru
  page-navigation: true

  chapters:
    - index.qmd
    - teaching-guide.qmd
    - slides.qmd
    - part: "Foundations"
      chapters:
        - rna-seq/after-submission.qmd
        - rna-seq/computing.qmd
        - rna-seq/practice-setup.qmd
        - rna-seq/shell-basics.qmd
        - rna-seq/sequence-files.qmd
        - rna-seq/annotation-files.qmd
        - rna-seq/alignment-files.qmd
        - rna-seq/tools-landscape.qmd
    - part: "RNA-seq, step by step"
      chapters:
        - rna-seq/pipeline-map.qmd
        - rna-seq/fastqc.qmd
        - rna-seq/trimming.qmd
        - rna-seq/salmon.qmd
        - rna-seq/alignment.qmd
        - rna-seq/signal-tracks.qmd
        - rna-seq/merging.qmd
        - rna-seq/multiqc.qmd
        - rna-seq/tximport.qmd
    - part: "Running it yourself"
      chapters:
        - rna-seq/snakemake.qmd
        - rna-seq/running-rnapipe.qmd
        - rna-seq/into-r.qmd
    - part: "Related assays"
      chapters:
        - rna-seq/tt-seq.qmd
  appendices:
    - appendix/glossary.qmd
    - appendix/cheatsheet.qmd
    - appendix/troubleshooting.qmd
    - appendix/references.qmd

  sidebar:
    style: docked
    background: light

format:
  html:
    theme:
      light: [cosmo, custom.scss]
    mermaid:
      theme: neutral
    code-background: true
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    smooth-scroll: true
    link-external-icon: true
    link-external-newwindow: true
    number-depth: 2

filters:
  - _filters/slides-button.lua

# Which slide deck (and slide) each chapter's "Slides" button opens.
slide-map:
  rna-seq/after-submission.qmd: "01-sequencer-to-shell.html#/library"
  rna-seq/computing.qmd: "01-sequencer-to-shell.html#/computing"
  rna-seq/practice-setup.qmd: "01-sequencer-to-shell.html#/practice-setup"
  rna-seq/shell-basics.qmd: "01-sequencer-to-shell.html#/shell"
  rna-seq/sequence-files.qmd: "02-file-formats.html#/fastq"
  rna-seq/annotation-files.qmd: "02-file-formats.html#/coordinates"
  rna-seq/alignment-files.qmd: "02-file-formats.html#/sam-bam"
  rna-seq/tools-landscape.qmd: "03-clean-and-check.html#/roads"
  rna-seq/pipeline-map.qmd: "03-clean-and-check.html#/pipeline-map"
  rna-seq/fastqc.qmd: "03-clean-and-check.html#/fastqc"
  rna-seq/trimming.qmd: "03-clean-and-check.html#/trimming"
  rna-seq/salmon.qmd: "04-quantify-and-align.html#/salmon"
  rna-seq/alignment.qmd: "04-quantify-and-align.html#/alignment"
  rna-seq/signal-tracks.qmd: "04-quantify-and-align.html#/signal"
  rna-seq/merging.qmd: "04-quantify-and-align.html#/merging"
  rna-seq/multiqc.qmd: "04-quantify-and-align.html#/multiqc"
  rna-seq/tximport.qmd: "04-quantify-and-align.html#/tximport"
  rna-seq/snakemake.qmd: "05-pipeline-and-r.html#/why-snakemake"
  rna-seq/running-rnapipe.qmd: "05-pipeline-and-r.html#/running"
  rna-seq/into-r.qmd: "05-pipeline-and-r.html#/into-r"
  rna-seq/tt-seq.qmd: "05-pipeline-and-r.html#/tt-seq"
